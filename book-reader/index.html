<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Book Reader</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #14120f; color: #f5e6c8; font-family: Georgia, 'Times New Roman', serif; }

  /* ---------- EDIT SCREEN ---------- */
  #editScreen { display: flex; flex-direction: column; height: 100%; padding: 20px; gap: 14px; }
  #editScreen h1 { font-size: 26px; font-weight: normal; letter-spacing: 0.5px; }
  #editScreen p.hint { font-size: 15px; color: #b8a988; line-height: 1.5; }
  #pasteBox {
    flex: 1; width: 100%; background: #1e1b16; color: #f5e6c8;
    border: 1px solid #3a352b; border-radius: 12px; padding: 16px;
    font-family: Georgia, serif; font-size: 17px; line-height: 1.6; resize: none; outline: none;
  }
  .bigBtn {
    display: block; width: 100%; padding: 18px; border: none; border-radius: 12px;
    background: #f5e6c8; color: #14120f; font-family: Georgia, serif;
    font-size: 20px; cursor: pointer;
  }
  .bigBtn:active { opacity: 0.8; }

  /* ---------- READING SCREEN ---------- */
  #readScreen { display: none; height: 100%; position: relative; overflow: hidden; }
  #scroller {
    height: 100%; overflow-y: auto; padding: 45vh 6vw 60vh 6vw;
    scrollbar-width: none;
  }
  #scroller::-webkit-scrollbar { display: none; }
  #readText { line-height: 1.75; white-space: pre-wrap; }

  /* soft fade top & bottom so the eye stays center */
  .fade { position: absolute; left: 0; right: 0; height: 18vh; pointer-events: none; z-index: 2; }
  .fadeTop { top: 0; background: linear-gradient(#14120f, transparent); }
  .fadeBottom { bottom: 78px; background: linear-gradient(transparent, #14120f); }

  #pausedBadge {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    background: rgba(245,230,200,0.12); border: 1px solid rgba(245,230,200,0.3);
    color: #f5e6c8; padding: 6px 18px; border-radius: 20px; font-size: 14px;
    z-index: 5; letter-spacing: 1px;
  }

  /* ---------- CONTROL BAR ---------- */
  #controls {
    position: absolute; bottom: 0; left: 0; right: 0; height: 78px;
    background: #1e1b16; border-top: 1px solid #3a352b;
    display: flex; align-items: center; justify-content: space-around;
    z-index: 10; padding: 0 6px;
  }
  .ctrl {
    background: none; border: 1px solid #4a4436; color: #f5e6c8;
    border-radius: 10px; font-family: Georgia, serif; cursor: pointer;
    padding: 10px 12px; font-size: 15px; min-width: 52px;
  }
  .ctrl:active { background: #3a352b; }
  .ctrlGroup { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .ctrlGroup .row { display: flex; gap: 8px; }
  .ctrlLabel { font-size: 11px; color: #b8a988; letter-spacing: 1px; text-transform: uppercase; }
</style>
</head>
<body>

<div id="editScreen">
  <h1>My Book Reader</h1>
  <p class="hint">Paste your chapter below, then press <b>Start Reading</b>. The words scroll by themselves — like a teleprompter. Tap the screen any time to pause or continue. Your writing is saved on this device automatically.</p>
  <textarea id="pasteBox" placeholder="Paste your chapter here..."></textarea>
  <button class="bigBtn" id="startBtn">Start Reading</button>
</div>

<div id="readScreen">
  <div class="fade fadeTop"></div>
  <div class="fade fadeBottom"></div>
  <div id="pausedBadge">PAUSED — tap to start</div>
  <div id="scroller"><div id="readText"></div></div>
  <div id="controls">
    <button class="ctrl" id="backBtn">&#8592; Edit</button>
    <div class="ctrlGroup">
      <div class="row">
        <button class="ctrl" id="slower">&#8722;</button>
        <button class="ctrl" id="faster">+</button>
      </div>
      <span class="ctrlLabel">Speed</span>
    </div>
    <div class="ctrlGroup">
      <div class="row">
        <button class="ctrl" id="smaller">A&#8722;</button>
        <button class="ctrl" id="bigger">A+</button>
      </div>
      <span class="ctrlLabel">Text size</span>
    </div>
    <button class="ctrl" id="restartBtn">&#8634; Top</button>
  </div>
</div>

<script>
(function () {
  var editScreen = document.getElementById('editScreen');
  var readScreen = document.getElementById('readScreen');
  var pasteBox = document.getElementById('pasteBox');
  var readText = document.getElementById('readText');
  var scroller = document.getElementById('scroller');
  var badge = document.getElementById('pausedBadge');

  var playing = false;
  var speed = parseFloat(localStorage.getItem('tp_speed')) || 0.6;   // pixels per frame
  var fontSize = parseInt(localStorage.getItem('tp_font'), 10) || 34;
  var rafId = null;
  var carry = 0;

  // restore saved text
  pasteBox.value = localStorage.getItem('tp_text') || '';
  pasteBox.addEventListener('input', function () {
    localStorage.setItem('tp_text', pasteBox.value);
  });

  function applyFont() {
    readText.style.fontSize = fontSize + 'px';
    localStorage.setItem('tp_font', fontSize);
  }

  function setPlaying(on) {
    playing = on;
    badge.style.display = on ? 'none' : 'block';
    badge.textContent = 'PAUSED — tap to continue';
    if (on && !rafId) rafId = requestAnimationFrame(step);
  }

  function step() {
    rafId = null;
    if (!playing) return;
    carry += speed;
    var px = Math.floor(carry);
    if (px >= 1) { scroller.scrollTop += px; carry -= px; }
    // stop at the end
    if (scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 2) {
      setPlaying(false);
      badge.textContent = 'THE END — tap Top to read again';
      badge.style.display = 'block';
      return;
    }
    rafId = requestAnimationFrame(step);
  }

  document.getElementById('startBtn').addEventListener('click', function () {
    var text = pasteBox.value.trim();
    if (!text) { pasteBox.focus(); return; }
    readText.textContent = text;
    applyFont();
    editScreen.style.display = 'none';
    readScreen.style.display = 'block';
    scroller.scrollTop = 0;
    badge.textContent = 'PAUSED — tap to start';
    setPlaying(false);
  });

  // tap the reading area to play/pause
  scroller.addEventListener('click', function () { setPlaying(!playing); });
  badge.addEventListener('click', function () { setPlaying(true); });

  document.getElementById('backBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    setPlaying(false);
    readScreen.style.display = 'none';
    editScreen.style.display = 'flex';
  });

  document.getElementById('restartBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    scroller.scrollTop = 0;
    setPlaying(false);
    badge.textContent = 'PAUSED — tap to start';
    badge.style.display = 'block';
  });

  document.getElementById('slower').addEventListener('click', function (e) {
    e.stopPropagation();
    speed = Math.max(0.15, speed - 0.15);
    localStorage.setItem('tp_speed', speed);
  });
  document.getElementById('faster').addEventListener('click', function (e) {
    e.stopPropagation();
    speed = Math.min(3, speed + 0.15);
    localStorage.setItem('tp_speed', speed);
  });
  document.getElementById('smaller').addEventListener('click', function (e) {
    e.stopPropagation();
    fontSize = Math.max(20, fontSize - 3);
    applyFont();
  });
  document.getElementById('bigger').addEventListener('click', function (e) {
    e.stopPropagation();
    fontSize = Math.min(72, fontSize + 3);
    applyFont();
  });

  // keep screen awake while reading (works on modern iPhones/iPads)
  var wakeLock = null;
  function requestWake() {
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').then(function (wl) { wakeLock = wl; }).catch(function () {});
    }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') requestWake();
  });
  requestWake();
})();
</script>
</body>
</html>
